<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Web旅館 ゆけむり</title>
<style>
:root{
  --bg-dark:#1d1a19;
  --bg-editor:#f5f3ef;
  --bg-paper:#ffffff;
  --ink:#2c2c2c;
  --muted:#6e6b66;
  --line:#e0dad3;
  --accent:#5a4a42;
  --accent-btn:#ece6de;
  --accent-btn-hover:#dfd8ce;
  --primary-btn:#5a4a42;
  --primary-btn-text:#ffffff;
  --danger-btn:#a33a3a;
}
*{box-sizing:border-box}
body{
  margin:0;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  background:var(--bg-dark);
  min-height:100vh;
}
button,input,textarea{font:inherit}
button{cursor:pointer;border:none;outline:none}
.hidden{display:none!important}

/* --- ロビー / 作品一覧画面 --- */
.screen-lobby{min-height:100vh;padding:18px;display:flex;align-items:center;justify-content:center}
.card{max-width:850px;width:100%;margin:0 auto;background:#fcfaf7;border:1px solid #dcd5cc;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.3);overflow:hidden}
header{padding:24px 28px 18px;background:#3a322d;color:#fff;display:flex;justify-content:space-between;align-items:flex-end}
.kamon{font-size:12px;letter-spacing:.2em;opacity:.7}
h1{margin:6px 0 2px;font-family:serif;font-size:clamp(22px,4vw,32px);font-weight:500}
.subtitle{font-size:13px;opacity:.8}
.setup{padding:24px;display:grid;gap:16px}

/* 作品リスト表示 */
.project-list-container{display:grid;gap:12px;margin-bottom:8px}
.project-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;background:#fff;border:1px solid var(--line);
  border-radius:8px;transition:border-color .15s;
}
.project-item:hover{border-color:var(--accent)}
.project-info{display:grid;gap:4px}
.project-title-text{font-weight:600;font-size:15px;color:var(--ink)}
.project-meta-text{font-size:12px;color:var(--muted)}
.project-actions{display:flex;gap:8px}

.empty-state{
  padding:32px 16px;text-align:center;color:var(--muted);
  background:#fff;border:1px dashed var(--line);border-radius:8px;font-size:14px;
}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:grid;gap:6px;font-weight:600;font-size:13px;color:#4a423d}
input,textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);padding:10px;outline:none}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(90,74,66,0.15)}
textarea{resize:vertical;min-height:120px;line-height:1.6}
.primary{border-radius:6px;padding:10px 18px;background:var(--primary-btn);color:var(--primary-btn-text);font-weight:600;font-size:14px}
.secondary{border:1px solid var(--line);border-radius:6px;padding:8px 14px;background:var(--accent-btn);color:var(--ink);font-weight:500;font-size:13px;transition:background .15s}
.secondary:hover{background:var(--accent-btn-hover)}
.danger{border-radius:6px;padding:6px 10px;background:var(--danger-btn);color:#fff;font-size:12px}
.note{font-size:11px;color:var(--muted);line-height:1.6}

/* --- 執筆画面（エディタUI） --- */
#write{
  min-height:100vh;
  min-height:100dvh;
  background:var(--bg-editor);
  display:flex;
  flex-direction:column;
}
.editor-container{
  max-width:960px;
  width:100%;
  margin:0 auto;
  flex:1;
  display:flex;
  flex-direction:column;
  padding:12px 16px;
  box-sizing:border-box;
}

/* 上部ステータスバー */
.editor-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 4px 10px;
  font-size:12px;
  color:var(--muted);
  border-bottom:1px solid var(--line);
  margin-bottom:8px;
  flex-wrap:wrap;
  gap:6px;
}
.editor-header .title-container{
  display:flex;
  align-items:center;
  gap:6px;
}
.editor-header .title-input{
  font-family:serif;
  font-weight:600;
  color:var(--ink);
  font-size:15px;
  border:1px transparent solid;
  background:transparent;
  padding:2px 6px;
  border-radius:4px;
  max-width:240px;
}
.editor-header .title-input:hover{border-color:var(--line);background:#fff}
.editor-header .title-input:focus{border-color:var(--accent);background:#fff}

.editor-header .stats-info{
  display:flex;
  align-items:center;
  gap:12px;
  font-variant-numeric:tabular-nums;
}
.stats-info span b{
  color:var(--ink);
  font-weight:600;
}

/* 本文入力エリア */
.editor-main{
  flex:1;
  display:flex;
  flex-direction:column;
  position:relative;
  min-height:350px;
}
#manuscript{
  width:100%;
  flex:1;
  border:1px solid var(--line);
  border-radius:8px;
  padding:20px;
  background:var(--bg-paper);
  color:var(--ink);
  font-family:serif;
  font-size:17px;
  line-height:2.1;
  resize:none;
  outline:none;
  box-shadow:inset 0 1px 3px rgba(0,0,0,0.02);
}
#manuscript::placeholder{
  color:#b5b0a8;
  font-family:sans-serif;
  font-size:14px;
}

/* 下部操作ボタンエリア */
.editor-footer{
  margin-top:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.symbol-bar{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.symbol-btn{
  border:1px solid var(--line);
  border-radius:4px;
  background:#fff;
  color:var(--ink);
  padding:4px 10px;
  font-size:13px;
  font-family:serif;
  transition:background .15s;
}
.symbol-btn:hover{background:#f0ebe3}

.action-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
}
.action-group{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.footer-meta{
  font-size:11px;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:12px;
}

/* モーダル共通 */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.5);
  display:grid;place-items:center;padding:16px;z-index:100;
}
.modal-box{
  width:min(640px,100%);background:#fff;
  border-radius:10px;padding:20px;
  box-shadow:0 10px 40px rgba(0,0,0,0.3);
  display:flex;
  flex-direction:column;
  max-height:85vh;
}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-head h2{font-size:16px;margin:0;color:var(--ink);font-weight:600}
.close-btn{border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer;padding:0 4px}
.plot-textarea{width:100%;flex:1;min-height:240px;border:1px solid var(--line);border-radius:6px;padding:12px;line-height:1.7;font-size:14px;resize:vertical;margin-bottom:12px}

/* 通知トースト・演出 */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2c2c2c;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;box-shadow:0 4px 15px rgba(0,0,0,0.2);opacity:0;pointer-events:none;transition:.25s;z-index:200}
.toast.show{opacity:1}
.milestone{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;place-items:center;z-index:150;padding:20px}
.milestone.show{display:grid}
.mbox{max-width:440px;width:100%;background:#fffaf5;color:var(--ink);border-radius:12px;padding:28px;text-align:center;box-shadow:0 15px 50px rgba(0,0,0,0.3)}
.mbox h2{font-family:serif;font-size:26px;margin:0 0 10px;color:var(--accent)}

@media(max-width:600px){
  .screen-lobby{padding:10px}
  .grid{grid-template-columns:1fr}
  .editor-container{padding:8px 10px}
  .editor-header{font-size:11px;padding:4px 2px 8px}
  .editor-header .title-input{max-width:130px;font-size:13px}
  #manuscript{padding:14px;font-size:16px;line-height:1.9}
  .symbol-btn{padding:5px 8px;font-size:12px}
  .secondary{padding:7px 10px;font-size:12px}
  .footer-meta{font-size:10px}
}
</style>
</head>
<body>

<!-- 非表示のファイル読み込み用input -->
<input type="file" id="importFileInput" accept=".json" style="display:none;" onchange="handleFileImport(event)">

<!-- ロビー画面（作品一覧＆新規作成） -->
<section id="lobby" class="screen-lobby">
  <div class="card">
    <header>
      <div>
        <div class="kamon">Web原稿合宿専用宿</div>
        <h1>Web旅館 ゆけむり</h1>
      </div>
      <button class="primary" onclick="showNewProjectModal()">＋ 新規作品を作成</button>
    </header>
    <div class="setup">
      <div style="font-weight:600;font-size:14px;color:#4a423d;">作品一覧</div>
      <div id="projectList" class="project-list-container">
        <!-- JSで作品カードを挿入 -->
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;">
        <button class="secondary" onclick="exportBackupData()">全データバックアップ (JSON)</button>
        <button class="secondary" onclick="triggerImportFile()">全データ復元 (JSON読み込み)</button>
      </div>

      <div class="note">
        本文と設定はブラウザの内部ストレージに保存されます。端末間で作品を移行したい場合は、バックアップファイル（.json）を出力して別端末で読み込んでください。
      </div>
    </div>
  </div>
</section>

<!-- 執筆画面（小説エディタ風UI） -->
<section id="write" class="hidden">
  <div class="editor-container">
    
    <!-- 上部：ステータスバー -->
    <div class="editor-header">
      <div class="title-container">
        <input id="roomTitle" class="title-input" title="クリックしてタイトルを変更" placeholder="無題" onchange="updateTitleFromInput()">
      </div>
      <div class="stats-info">
        <span>文字数: <b id="count">0</b></span>
        <span>目標: <b id="goalView">10,000</b></span>
        <span>進捗: <b id="percent">0%</b></span>
      </div>
    </div>

    <!-- 中央：本文入力欄 -->
    <div class="editor-main">
      <textarea id="manuscript" placeholder="ここに本文を執筆してください……"></textarea>
    </div>

    <!-- 下部：記号ボタン & 操作アクション -->
    <div class="editor-footer">
      <div class="symbol-bar">
        <button class="symbol-btn" onclick="insertSymbol('――')">――</button>
        <button class="symbol-btn" onclick="insertBracket('「', '」')">「」</button>
        <button class="symbol-btn" onclick="insertBracket('『', '』')">『』</button>
        <button class="symbol-btn" onclick="insertBracket('（', '）')">（）</button>
      </div>

      <div class="action-bar">
        <div class="action-group">
          <button class="secondary" onclick="saveNow()">local保存</button>
          <button class="secondary" onclick="exportTxt()">txt書き出し</button>
          <button class="secondary" onclick="showPlot()">プロット</button>
          <button class="secondary" onclick="showProjectList()">作品一覧</button>
        </div>
        <div class="footer-meta">
          <span>時間: <span id="timer">00:00:00</span></span>
          <span id="saved">自動保存: 準備中</span>
          <button class="secondary" onclick="exportBackupData()">JSONバックアップ</button>
        </div>
      </div>
    </div>

  </div>

  <!-- プロット表示モーダル -->
  <div id="plotOverlay" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h2>プロット・メモ</h2>
        <button class="close-btn" onclick="hidePlot()">×</button>
      </div>
      <textarea id="plotWork" class="plot-textarea"></textarea>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button class="secondary" onclick="hidePlot()">閉じる</button>
        <button class="primary" onclick="savePlot()">保存する</button>
      </div>
    </div>
  </div>
</section>

<!-- 新規作品作成モーダル -->
<div id="newProjectOverlay" class="modal-overlay hidden">
  <div class="modal-box" style="max-width:500px;">
    <div class="modal-head">
      <h2>新規作品の作成</h2>
      <button class="close-btn" onclick="hideNewProjectModal()">×</button>
    </div>
    <div style="display:grid;gap:12px;margin-bottom:16px;">
      <label>作品名
        <input id="newTitle" placeholder="作品名を入力します。執筆開始後も変更可能です。">
      </label>
      <label>目標文字数
        <input id="newGoal" type="number" min="1" step="100" value="10000">
      </label>
      <label>プロット・メモ
        <textarea id="newPlot" style="min-height:80px;" placeholder="登場人物やアウトラインなど"></textarea>
      </label>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;">
      <button class="secondary" onclick="hideNewProjectModal()">キャンセル</button>
      <button class="primary" onclick="createNewProject()">作成して執筆開始</button>
    </div>
  </div>
</div>

<!-- トースト表示 -->
<div id="toast" class="toast"></div>

<!-- マイルストーン表示 -->
<div id="milestone" class="milestone">
  <div class="mbox">
    <h2 id="milestoneTitle">二千五百字</h2>
    <p id="milestoneText">執筆が順調に進んでいます。</p>
    <button class="primary" onclick="closeMilestone()">執筆を続ける</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'yugomori_v2_data';

// 全データ構造
let db = {
  currentId: null,
  projects: {}
};

let timerId, autoId;

function $(id) { return document.getElementById(id); }
function fmt(n) { return n.toLocaleString('ja-JP'); }

/* 今日の日付（YYYYMMDD）を取得 */
function getFormattedDate() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}${m}${day}`;
}

/* 安全なファイル名文字列の生成 */
function getSafeTitle(rawTitle) {
  const safe = (rawTitle || '無題').replace(/[\\/:*?"<>|]/g, '_').trim();
  return safe || '無題';
}

/* データの読み書き */
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      db = JSON.parse(raw);
    } else {
      // 互換性：旧形式データがあれば移行
      const old = localStorage.getItem('yugomori_v1');
      if (old) {
        const s = JSON.parse(old);
        const id = 'p_' + Date.now();
        db.projects[id] = {
          id: id,
          title: s.title || '無題の物語',
          goal: s.goal || 10000,
          plot: s.plot || '',
          text: s.text || '',
          elapsedTime: 0,
          lastMilestone: s.lastMilestone || 0,
          updatedAt: Date.now()
        };
        db.currentId = id;
        saveData();
      }
    }
  } catch(e) {}
}

function saveData() {
  if (db.currentId && db.projects[db.currentId]) {
    const p = db.projects[db.currentId];
    p.text = $('manuscript')?.value ?? p.text;
    p.plot = $('plotWork')?.value ?? p.plot;
    p.title = $('roomTitle')?.value ?? p.title;
    p.updatedAt = Date.now();
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
  if ($('saved')) {
    $('saved').textContent = '自動保存: ' + new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
  }
}

/* 作品一覧UIの描画 */
function renderProjectList() {
  const container = $('projectList');
  container.innerHTML = '';

  const list = Object.values(db.projects).sort((a,b) => b.updatedAt - a.updatedAt);

  if (list.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        作品が登録されていません。<br>右上ボタンの「＋ 新規作品を作成」から新しい執筆を開始してください。
      </div>
    `;
    return;
  }

  list.forEach(p => {
    const count = [...(p.text || '')].length;
    const item = document.createElement('div');
    item.className = 'project-item';
    item.innerHTML = `
      <div class="project-info">
        <div class="project-title-text">${escapeHtml(p.title || '無題')}</div>
        <div class="project-meta-text">${fmt(count)} 字 / 目標 ${fmt(p.goal)} 字 (${Math.min(100, Math.floor(count/p.goal*100))}%)</div>
      </div>
      <div class="project-actions">
        <button class="secondary" onclick="openProject('${p.id}')">執筆する</button>
        <button class="danger" onclick="deleteProject('${p.id}')">削除</button>
      </div>
    `;
    container.appendChild(item);
  });
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* 作品切り替え・作成・削除 */
function openProject(id) {
  commitSessionTime();
  saveData();
  db.currentId = id;
  const p = db.projects[id];

  $('roomTitle').value = p.title || '無題';
  $('goalView').textContent = fmt(p.goal || 10000);
  $('manuscript').value = p.text || '';
  $('plotWork').value = p.plot || '';

  $('lobby').classList.add('hidden');
  $('write').classList.remove('hidden');

  update();
  saveData();
  startClocks();
}

function showProjectList() {
  commitSessionTime();
  saveData();
  clearInterval(timerId);
  clearInterval(autoId);
  renderProjectList();
  $('write').classList.add('hidden');
  $('lobby').classList.remove('hidden');
}

function showNewProjectModal() {
  $('newTitle').value = '';
  $('newGoal').value = 10000;
  $('newPlot').value = '';
  $('newProjectOverlay').classList.remove('hidden');
}

function hideNewProjectModal() {
  $('newProjectOverlay').classList.add('hidden');
}

function createNewProject() {
  const title = $('newTitle').value.trim() || '無題の物語';
  const goal = Math.max(1, Number($('newGoal').value) || 10000);
  const plot = $('newPlot').value;

  const id = 'p_' + Date.now();
  db.projects[id] = {
    id: id,
    title: title,
    goal: goal,
    plot: plot,
    text: '',
    elapsedTime: 0,
    lastMilestone: 0,
    updatedAt: Date.now()
  };

  hideNewProjectModal();
  openProject(id);
  toast('新しい作品を作成しました');
}

function deleteProject(id) {
  const p = db.projects[id];
  if (confirm(`作品「${p.title}」を削除してもよろしいですか？`)) {
    delete db.projects[id];
    if (db.currentId === id) {
      const remainingIds = Object.keys(db.projects);
      db.currentId = remainingIds.length > 0 ? remainingIds[0] : null;
    }
    saveData();
    renderProjectList();
    toast('作品を削除しました');
  }
}

/* リアルタイムタイトル更新 */
function updateTitleFromInput() {
  const newTitle = $('roomTitle').value.trim() || '無題';
  if (db.currentId && db.projects[db.currentId]) {
    db.projects[db.currentId].title = newTitle;
    saveData();
  }
}

/* タイマー制御 */
let sessionStartTime = null;

function startClocks() {
  clearInterval(timerId);
  clearInterval(autoId);
  sessionStartTime = Date.now();
  
  timerId = setInterval(updateTimer, 1000);
  autoId = setInterval(saveData, 15000);
  updateTimer();
}

function updateTimer() {
  if (!db.currentId || !db.projects[db.currentId]) return;
  const p = db.projects[db.currentId];
  const currentSessionSec = Math.floor((Date.now() - sessionStartTime) / 1000);
  const totalSec = (p.elapsedTime || 0) + currentSessionSec;

  const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
  const m = String(Math.floor(totalSec % 3600 / 60)).padStart(2, '0');
  const s = String(totalSec % 60).padStart(2, '0');
  $('timer').textContent = `${h}:${m}:${s}`;
}

function commitSessionTime() {
  if (!sessionStartTime || !db.currentId || !db.projects[db.currentId]) return;
  const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
  if (elapsed > 0) {
    db.projects[db.currentId].elapsedTime = (db.projects[db.currentId].elapsedTime || 0) + elapsed;
  }
  sessionStartTime = Date.now();
}

function saveNow() {
  commitSessionTime();
  saveData();
  toast('原稿を保存しました');
}

/* 本文カウントとマイルストーン */
function countText(t) { return [...t].length; }

function update() {
  if (!db.currentId || !db.projects[db.currentId]) return;
  const p = db.projects[db.currentId];
  const n = countText($('manuscript').value);
  const g = Math.max(1, p.goal || 10000);

  $('count').textContent = fmt(n);
  $('percent').textContent = Math.min(100, Math.floor(n / g * 100)) + '%';

  const milestone = Math.floor(n / 2500) * 2500;
  if (milestone > 0 && milestone > (p.lastMilestone || 0)) {
    p.lastMilestone = milestone;
    showMilestone(milestone);
  }
}

function showMilestone(n) {
  const scenes = [
    ['二千五百字', '執筆が着実に進んでいます。'],
    ['五千字', '半分まで到達しました。この調子で進めましょう。'],
    ['七千五百字', 'ゴールが見えてきました。'],
    ['一万字', '一万字を達成しました！'],
    ['到達', '目標文字数を突破しました！お疲れ様です。']
  ];
  let i = n >= 10000 ? 4 : Math.floor(n / 2500) - 1;
  $('milestoneTitle').textContent = scenes[i][0];
  $('milestoneText').textContent = scenes[i][1];
  $('milestone').classList.add('show');
}

function closeMilestone() {
  $('milestone').classList.remove('show');
  $('manuscript').focus();
}

/* 記号・括弧挿入 */
function insertSymbol(sym) {
  const el = $('manuscript');
  const start = el.selectionStart;
  const end = el.selectionEnd;
  el.setRangeText(sym, start, end, 'end');
  update();
  saveData();
  el.focus();
}

function insertBracket(open, close) {
  const el = $('manuscript');
  const start = el.selectionStart;
  const end = el.selectionEnd;
  const selectedText = el.value.substring(start, end);

  const textToInsert = open + selectedText + close;
  el.setRangeText(textToInsert, start, end, 'select');

  if (start === end) {
    el.setSelectionRange(start + open.length, start + open.length);
  }

  update();
  saveData();
  el.focus();
}

/* プロット関係 */
function showPlot() {
  if (db.currentId && db.projects[db.currentId]) {
    $('plotWork').value = db.projects[db.currentId].plot || '';
  }
  $('plotOverlay').classList.remove('hidden');
}
function hidePlot() {
  $('plotOverlay').classList.add('hidden');
}
function savePlot() {
  if (db.currentId && db.projects[db.currentId]) {
    db.projects[db.currentId].plot = $('plotWork').value;
    saveData();
  }
  hidePlot();
  toast('プロットを保存しました');
}

/* 原稿書き出し */
function exportTxt() {
  saveNow();
  if (!db.currentId || !db.projects[db.currentId]) return;
  
  const p = db.projects[db.currentId];
  const safeTitle = getSafeTitle(p.title);
  const dateStr = getFormattedDate();
  const fileName = `${safeTitle}_${dateStr}.txt`;
  
  const rawText = p.text || '';

  const indentedText = rawText.split('\n').map(line => {
    if (line.length === 0) return line;
    if (line.startsWith('　')) return line;
    return '　' + line;
  }).join('\n');

  const body = `${p.title || '無題'}\n\n${indentedText}\n`;

  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([body], { type: 'text/plain;charset=utf-8' }));
  a.download = fileName;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('原稿を書き出しました');
}

/* 全データバックアップ（JSON出力） */
function exportBackupData() {
  saveNow();
  let safeTitle = '原稿';
  if (db.currentId && db.projects[db.currentId]) {
    safeTitle = getSafeTitle(db.projects[db.currentId].title);
  }
  const dateStr = getFormattedDate();
  const fileName = `${safeTitle}_バックアップ_${dateStr}.json`;

  const dataStr = JSON.stringify(db, null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([dataStr], { type: 'application/json' }));
  a.download = fileName;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('バックアップを出力しました');
}

/* 全データ復元（JSON読み込み） */
function triggerImportFile() {
  $('importFileInput').click();
}

function handleFileImport(event) {
  commitSessionTime();
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (imported && imported.projects) {
        if (confirm('現在のデータを上書きしてバックアップから復元しますか？')) {
          db = imported;
          saveData();
          renderProjectList();
          if (!$('write').classList.contains('hidden') && db.currentId && db.projects[db.currentId]) {
            openProject(db.currentId);
          }
          toast('データを復元しました');
        }
      } else {
        alert('無効なバックアップファイルです。');
      }
    } catch(err) {
      alert('ファイルの読み込みに失敗しました。');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

function toast(t) {
  const e = $('toast');
  e.textContent = t;
  e.classList.add('show');
  setTimeout(() => e.classList.remove('show'), 1800);
}

// イベント設定と初期起動
$('manuscript').addEventListener('input', () => { update(); saveData(); });

loadData();
renderProjectList();
</script>
