<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Web旅館 ゆけむり</title>
<style>
:root{
  --bg-dark:#1d1a19;
  --bg-editor:#f5f3ef;
  --bg-paper:#ffffff;
  --ink:#2c2c2c;
  --muted:#6e6b66;
  --line:#e0dad3;
  --accent:#5a4a42;
  --accent-btn:#ece6de;
  --accent-btn-hover:#dfd8ce;
  --primary-btn:#5a4a42;
  --primary-btn-text:#ffffff;
  --danger-btn:#a33a3a;
}
*{box-sizing:border-box}
body{
  margin:0;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  background:var(--bg-dark);
  min-height:100vh;
  min-height:100dvh;
}
button,input,textarea{font:inherit}
button{cursor:pointer;border:none;outline:none;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}

/* --- ロビー / 作品一覧画面 --- */
.screen-lobby{
  min-height:100vh;
  min-height:100dvh;
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card{
  max-width:850px;
  width:100%;
  margin:0 auto;
  background:#fcfaf7;
  border:1px solid #dcd5cc;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
  overflow:hidden;
}
header{
  padding:24px 28px 18px;
  background:#3a322d;
  color:#fff;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
}
.kamon{font-size:12px;letter-spacing:.2em;opacity:.7}
h1{margin:6px 0 2px;font-family:serif;font-size:clamp(22px,4vw,32px);font-weight:500}
.subtitle{font-size:13px;opacity:.8}
.setup{padding:24px;display:grid;gap:16px}

/* 作品リスト表示 */
.project-list-container{display:grid;gap:12px;margin-bottom:8px}
.project-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
  transition:border-color .15s;
  gap:12px;
  min-width:0;
}
.project-item:hover{border-color:var(--accent)}
.project-info{
  display:grid;
  gap:4px;
  flex:1;
  min-width:0;
}
.project-title-text{
  font-weight:600;
  font-size:15px;
  color:var(--ink);
  word-break:break-word;
}
.project-meta-text{
  font-size:12px;
  color:var(--muted);
  line-height:1.4;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.project-actions{display:flex;gap:6px;flex-shrink:0}

.empty-state{
  padding:32px 16px;text-align:center;color:var(--muted);
  background:#fff;border:1px dashed var(--line);border-radius:8px;font-size:14px;
}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.datetime-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:0;}

label{display:grid;gap:6px;font-weight:600;font-size:13px;color:#4a423d;min-width:0;}
input,textarea{
  width:100%;
  max-width:100%;
  min-width:0;
  border:1px solid var(--line);
  border-radius:6px;
  background:#fff;
  color:var(--ink);
  padding:10px;
  outline:none;
}

/* datetime-localのスマホ用崩れ対策 */
input[type="datetime-local"] {
  -webkit-appearance: none;
  appearance: none;
  min-height: 42px;
  background-color: #fff;
}

input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(90,74,66,0.15)}
textarea{resize:vertical;min-height:120px;line-height:1.6}
.primary{
  border-radius:6px;
  padding:10px 18px;
  background:var(--primary-btn);
  color:var(--primary-btn-text);
  font-weight:600;
  font-size:14px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.secondary{
  border:1px solid var(--line);
  border-radius:6px;
  padding:8px 14px;
  background:var(--accent-btn);
  color:var(--ink);
  font-weight:500;
  font-size:13px;
  transition:background .15s;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.secondary:hover{background:var(--accent-btn-hover)}
.danger{
  border-radius:6px;
  padding:6px 10px;
  background:var(--danger-btn);
  color:#fff;
  font-size:12px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.note{font-size:11px;color:var(--muted);line-height:1.6}

/* --- 執筆画面（エディタUI） --- */
#write{
  height:100vh;
  height:100dvh;
  background:var(--bg-editor);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.editor-container{
  max-width:960px;
  width:100%;
  margin:0 auto;
  height:100%;
  display:flex;
  flex-direction:column;
  padding:12px 16px;
  box-sizing:border-box;
}

/* 上部ステータスバー（右寄せ） */
.editor-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 4px 10px;
  font-size:12px;
  color:var(--muted);
  border-bottom:1px solid var(--line);
  margin-bottom:8px;
  flex-shrink:0;
  gap:12px;
}
.editor-header .title-container{
  display:flex;
  align-items:center;
  gap:6px;
  flex:1;
  min-width:0;
}
.editor-header .title-input{
  font-family:serif;
  font-weight:600;
  color:var(--ink);
  font-size:15px;
  border:1px transparent solid;
  background:transparent;
  padding:2px 6px;
  border-radius:4px;
  width:100%;
  max-width:240px;
}
.editor-header .title-input:hover{border-color:var(--line);background:#fff}
.editor-header .title-input:focus{border-color:var(--accent);background:#fff}

.editor-header .stats-info{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:12px;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  flex-shrink:0;
}
.stats-info span b{
  color:var(--ink);
  font-weight:600;
}
.edit-checkout-btn{
  background:none;
  border:none;
  color:var(--muted);
  font-size:11px;
  padding:2px 4px;
  text-decoration:underline;
  cursor:pointer;
}
.edit-checkout-btn:hover{
  color:var(--ink);
}

/* 本文入力エリア（スクロール独立） */
.editor-main{
  flex:1;
  display:flex;
  flex-direction:column;
  position:relative;
  min-height:0;
}
#manuscript{
  width:100%;
  height:100%;
  border:1px solid var(--line);
  border-radius:8px;
  padding:20px;
  background:var(--bg-paper);
  color:var(--ink);
  font-family:serif;
  font-size:17px;
  line-height:2.1;
  resize:none;
  outline:none;
  box-shadow:inset 0 1px 3px rgba(0,0,0,0.02);
}
#manuscript::placeholder{
  color:#b5b0a8;
  font-family:sans-serif;
  font-size:14px;
}

/* 下部操作ボタンエリア */
.editor-footer{
  margin-top:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
  flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom);
}
.symbol-bar{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:6px;
}
.symbol-btn{
  border:1px solid var(--line);
  border-radius:6px;
  background:#fff;
  color:var(--ink);
  padding:8px 0;
  font-size:13px;
  font-family:serif;
  text-align:center;
  transition:background .15s;
}
.symbol-btn:hover{background:#f0ebe3}
.symbol-btn:active{background:#e8e2d8}

.action-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}
.action-group{
  display:flex;
  gap:6px;
  flex:1;
}
.action-group .secondary{
  flex:1;
  padding:9px 0;
  font-size:12px;
}

/* 下部メタ情報エリア（右寄せに統一） */
.footer-meta{
  font-size:11px;
  color:var(--muted);
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:10px;
  padding:2px 2px 0;
  flex-wrap:wrap;
  font-variant-numeric:tabular-nums;
}

/* モーダル共通 */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.5);
  display:grid;place-items:center;padding:16px;z-index:100;
}
.modal-box{
  width:min(640px,100%);background:#fff;
  border-radius:10px;padding:20px;
  box-shadow:0 10px 40px rgba(0,0,0,0.3);
  display:flex;
  flex-direction:column;
  max-height:85vh;
  max-height:85dvh;
  overflow-y:auto;
}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-head h2{font-size:16px;margin:0;color:var(--ink);font-weight:600}
.close-btn{border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer;padding:0 4px}
.plot-textarea{width:100%;flex:1;min-height:200px;border:1px solid var(--line);border-radius:6px;padding:12px;line-height:1.7;font-size:14px;resize:vertical;margin-bottom:12px}

/* 通知トースト・演出 */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2c2c2c;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;box-shadow:0 4px 15px rgba(0,0,0,0.2);opacity:0;pointer-events:none;transition:.25s;z-index:200}
.toast.show{opacity:1}
.milestone{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;place-items:center;z-index:150;padding:20px}
.milestone.show{display:grid}
.mbox{max-width:440px;width:100%;background:#fffaf5;color:var(--ink);border-radius:12px;padding:28px;text-align:center;box-shadow:0 15px 50px rgba(0,0,0,0.3)}
.mbox h2{font-family:serif;font-size:26px;margin:0 0 10px;color:var(--accent)}

/* --- スマホ専用レスポンシブスタイル (600px以下) --- */
@media(max-width:600px){
  .screen-lobby{
    padding:10px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
  }
  header{padding:16px;flex-direction:column;align-items:flex-start;gap:12px}
  header button{width:100%}
  .setup{padding:16px 12px}
  .grid{grid-template-columns:1fr}
  
  .datetime-grid{
    grid-template-columns:1fr !important;
    gap:12px;
  }

  .project-item{flex-direction:column;align-items:stretch}
  .project-actions{justify-content:flex-end;margin-top:4px}
  .project-meta-text{font-size:11px;}

  input, textarea, select {
    font-size: 16px !important;
  }

  .editor-container{
    padding:6px 8px;
    padding-bottom: calc(6px + env(safe-area-inset-bottom));
  }
  .editor-header{
    flex-direction:column-reverse;
    align-items:stretch;
    gap:6px;
    padding-bottom:6px;
  }
  .editor-header .stats-info{
    justify-content:flex-end;
    flex-wrap:wrap;
    gap:4px 8px;
    font-size:11px;
    background:#ebe6de;
    padding:6px 8px;
    border-radius:4px;
  }
  .editor-header .title-input{
    max-width:100%;
    font-size:16px;
  }
  #manuscript{
    padding:12px;
    font-size:16px;
    line-height:1.85;
  }
  .action-bar{
    flex-direction:column;
    align-items:stretch;
  }
  .action-group{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:6px;
  }
  .footer-meta{
    font-size:10px;
    padding:4px 8px;
    justify-content:flex-end; /* スマホでも右寄せに維持 */
    background:#ebe6de;
    border-radius:4px;
    gap:8px;
  }
}
</style>
</head>
<body>

<input type="file" id="importFileInput" accept=".json" style="display:none;" onchange="handleFileImport(event)">

<section id="lobby" class="screen-lobby">
  <div class="card">
    <header>
      <div>
        <div class="kamon">Web原稿合宿専用宿</div>
        <h1>Web旅館 ゆけむり</h1>
      </div>
      <button class="primary" onclick="showNewProjectModal()">＋ 新規プラン作成</button>
    </header>
    <div class="setup">
      <div style="font-weight:600;font-size:14px;color:#4a423d;">ご滞在中の作品一覧</div>
      <div id="projectList" class="project-list-container"></div>

      <div class="grid">
        <button class="secondary" onclick="exportBackupData(true)">全データバックアップ (JSON)</button>
        <button class="secondary" onclick="triggerImportFile()">全データ復元 (JSON読み込み)</button>
      </div>

      <div class="note">
        本文と設定はブラウザの内部ストレージに保存されます。端末間で作品を移行したい場合は、バックアップファイル（.json）を出力して別端末で読み込んでください。
      </div>
    </div>
  </div>
</section>

<section id="write" class="hidden">
  <div class="editor-container">
    <div class="editor-header">
      <div class="title-container">
        <input id="roomTitle" class="title-input" title="クリックしてタイトルを変更" placeholder="無題" onchange="updateTitleFromInput()">
      </div>
      <div class="stats-info">
        <span>文字数: <b id="count">0</b></span>
        <span>目標: <b id="goalView">10,000</b></span>
        <span>進捗: <b id="percent">0%</b></span>
        <span id="checkoutCountdownContainer">残り: <b id="checkoutCountdown">--:--:--</b> <button class="edit-checkout-btn" onclick="showEditProjectModal(db.currentId)">⚙️変更</button></span>
      </div>
    </div>

    <div class="editor-main">
      <textarea id="manuscript" placeholder="ここに本文を執筆してください……"></textarea>
    </div>

    <div class="editor-footer">
      <div class="symbol-bar">
        <button class="symbol-btn" onclick="insertSymbol('――')">――</button>
        <button class="symbol-btn" onclick="insertBracket('「', '」')">「」</button>
        <button class="symbol-btn" onclick="insertBracket('『', '』')">『』</button>
        <button class="symbol-btn" onclick="insertBracket('（', '）')">（）</button>
      </div>

      <div class="action-bar">
        <div class="action-group">
          <button class="secondary" onclick="saveNow()">local保存</button>
          <button class="secondary" onclick="exportTxt()">txt書き出し</button>
          <button class="secondary" onclick="showPlot()">プロット</button>
          <button class="secondary" onclick="showProjectList()">作品一覧</button>
        </div>
      </div>

      <div class="footer-meta">
        <span>執筆時間: <span id="timer">00:00:00</span></span>
        <span id="saved">自動保存: 準備中</span>
        <button id="togglePopupBtn" class="secondary" style="padding:3px 8px;font-size:11px;" onclick="togglePopupSetting()">🎉 達成表示: オン</button>
        <button class="secondary" style="padding:3px 8px;font-size:11px;" onclick="exportBackupData()">JSONバックアップ</button>
      </div>
    </div>
  </div>

  <div id="plotOverlay" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h2>プロット・メモ</h2>
        <button class="close-btn" onclick="hidePlot()">×</button>
      </div>
      <textarea id="plotWork" class="plot-textarea"></textarea>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button class="secondary" onclick="hidePlot()">閉じる</button>
        <button class="primary" onclick="savePlot()">保存する</button>
      </div>
    </div>
  </div>
</section>

<!-- 新規/編集モーダル -->
<div id="newProjectOverlay" class="modal-overlay hidden">
  <div class="modal-box" style="max-width:500px;">
    <div class="modal-head">
      <h2 id="modalTitle">新規ご宿泊プランの作成</h2>
      <button class="close-btn" onclick="hideNewProjectModal()">×</button>
    </div>
    <div style="display:grid;gap:12px;margin-bottom:16px;">
      <label>作品名
        <input id="newTitle" placeholder="作品名を入力します（執筆中も変更可能）">
      </label>
      <label>目標文字数
        <input id="newGoal" type="number" min="1" step="100" value="10000">
      </label>
      <div class="datetime-grid">
        <label>チェックイン日時
          <input id="newCheckIn" type="datetime-local">
        </label>
        <label>チェックアウト日時
          <input id="newCheckOut" type="datetime-local">
        </label>
      </div>
      <label>プロット・メモ
        <textarea id="newPlot" style="min-height:80px;" placeholder="登場人物やストーリーのアウトラインなど"></textarea>
      </label>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;">
      <button class="secondary" onclick="hideNewProjectModal()">キャンセル</button>
      <button id="saveProjectBtn" class="primary" onclick="saveProjectModal()">原稿合宿を開始</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<div id="milestone" class="milestone">
  <div class="mbox">
    <h2 id="milestoneTitle">二千五百字</h2>
    <p id="milestoneText">執筆が順調に進んでいます。</p>
    <button class="primary" onclick="closeMilestone()">執筆を続ける</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'yugomori_v2_data';
const FULL_WIDTH_SPACE = '\u3000';

let db = {
  currentId: null,
  settings: {
    showMilestonePopup: true
  },
  projects: {}
};

let timerId, autoId;
let isPasting = false;
let editingProjectId = null;

function $(id) { return document.getElementById(id); }
function fmt(n) { return n.toLocaleString('ja-JP'); }

function getFormattedDate() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}${m}${day}`;
}

function formatDatetimeLocal(d) {
  if (!d) return '';
  const dateObj = (d instanceof Date) ? d : new Date(d);
  if (isNaN(dateObj.getTime())) return '';
  const pad = n => String(n).padStart(2, '0');
  return `${dateObj.getFullYear()}-${pad(dateObj.getMonth() + 1)}-${pad(dateObj.getDate())}T${pad(dateObj.getHours())}:${pad(dateObj.getMinutes())}`;
}

function formatDisplayDate(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  if (isNaN(d.getTime())) return '';
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function getSafeTitle(rawTitle) {
  const safe = (rawTitle || '無題').replace(/[\\/:*?"<>|]/g, '_').trim();
  return safe || '無題';
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      db = JSON.parse(raw);
      if (!db.settings) {
        db.settings = { showMilestonePopup: true };
      }
    }
  } catch(e) {}
  updatePopupBtnUI();
}

function saveData() {
  if (db.currentId && db.projects[db.currentId]) {
    const p = db.projects[db.currentId];
    p.text = $('manuscript')?.value ?? p.text;
    p.plot = $('plotWork')?.value ?? p.plot;
    p.title = $('roomTitle')?.value ?? p.title;
    p.updatedAt = Date.now();
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
  if ($('saved')) {
    $('saved').textContent = '自動保存: ' + new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
  }
}

function togglePopupSetting() {
  if (!db.settings) db.settings = {};
  db.settings.showMilestonePopup = !db.settings.showMilestonePopup;
  saveData();
  updatePopupBtnUI();
  toast(db.settings.showMilestonePopup ? '達成ポップアップを表示します' : '達成ポップアップを非表示にしました');
}

function updatePopupBtnUI() {
  const btn = $('togglePopupBtn');
  if (!btn) return;
  const isShow = db.settings?.showMilestonePopup !== false;
  btn.textContent = isShow ? '🎉 達成表示: オン' : '🎉 達成表示: オフ';
  btn.style.opacity = isShow ? '1' : '0.65';
}

function renderProjectList() {
  const container = $('projectList');
  container.innerHTML = '';

  const list = Object.values(db.projects).sort((a,b) => b.updatedAt - a.updatedAt);

  if (list.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        ご滞在中のプランがありません。<br>右上ボタンの「＋ 新規プラン作成」からチェックインしてください。
      </div>
    `;
    return;
  }

  list.forEach(p => {
    const count = [...(p.text || '')].length;
    const item = document.createElement('div');
    item.className = 'project-item';
    
    let timeStr = '';
    if (p.checkIn || p.checkOut) {
      const inStr = p.checkIn ? formatDisplayDate(p.checkIn) : '未設定';
      const outStr = p.checkOut ? formatDisplayDate(p.checkOut) : '未設定';
      timeStr = ` 滞在: ${inStr} 〜 ${outStr}`;
    }

    item.innerHTML = `
      <div class="project-info">
        <div class="project-title-text">${escapeHtml(p.title || '無題')}</div>
        <div class="project-meta-text">${fmt(count)} 字 / 目標 ${fmt(p.goal)} 字 (${Math.min(100, Math.floor(count/p.goal*100))}%)${timeStr}</div>
      </div>
      <div class="project-actions">
        <button class="secondary" onclick="openProject('${p.id}')">執筆部屋へ</button>
        <button class="secondary" onclick="showEditProjectModal('${p.id}')">編集</button>
        <button class="danger" onclick="deleteProject('${p.id}')">削除</button>
      </div>
    `;
    container.appendChild(item);
  });
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function ensureFirstLineIndent() {
  if (isPasting) return;
  const el = $('manuscript');
  if (!el) return;
  let val = el.value;

  if (val === '') return;

  if (!/^[  \u3000「『（【〈《〔[{『“"]/.test(val)) {
    const start = el.selectionStart;
    const end = el.selectionEnd;
    el.value = FULL_WIDTH_SPACE + val;
    el.setSelectionRange(start + 1, end + 1);
  }
}

function openProject(id) {
  commitSessionTime();
  saveData();
  db.currentId = id;
  const p = db.projects[id];

  $('roomTitle').value = p.title || '無題';
  $('goalView').textContent = fmt(p.goal || 10000);
  $('manuscript').value = p.text || '';
  $('plotWork').value = p.plot || '';

  $('lobby').classList.add('hidden');
  $('write').classList.remove('hidden');

  updatePopupBtnUI();
  update();
  saveData();
  startClocks();
}

function showProjectList() {
  commitSessionTime();
  saveData();
  clearInterval(timerId);
  clearInterval(autoId);
  renderProjectList();
  $('write').classList.add('hidden');
  $('lobby').classList.remove('hidden');
}

function showNewProjectModal() {
  editingProjectId = null;
  const now = new Date();
  const tomorrow = new Date(now.getTime() + 24 * 60 * 60 * 1000);

  $('modalTitle').textContent = '新規ご宿泊プランの作成';
  $('saveProjectBtn').textContent = '原稿合宿を開始';
  $('newTitle').value = '';
  $('newGoal').value = 10000;
  $('newCheckIn').value = formatDatetimeLocal(now);
  $('newCheckOut').value = formatDatetimeLocal(tomorrow);
  $('newPlot').value = '';
  $('newProjectOverlay').classList.remove('hidden');
}

function showEditProjectModal(id) {
  const p = db.projects[id];
  if (!p) return;

  editingProjectId = id;
  $('modalTitle').textContent = 'プラン情報の編集';
  $('saveProjectBtn').textContent = '変更内容を保存';
  $('newTitle').value = p.title || '';
  $('newGoal').value = p.goal || 10000;
  $('newCheckIn').value = formatDatetimeLocal(p.checkIn);
  $('newCheckOut').value = formatDatetimeLocal(p.checkOut);
  $('newPlot').value = p.plot || '';
  $('newProjectOverlay').classList.remove('hidden');
}

function hideNewProjectModal() {
  $('newProjectOverlay').classList.add('hidden');
  editingProjectId = null;
}

function saveProjectModal() {
  const title = $('newTitle').value.trim() || '無題の物語';
  const goal = Math.max(1, Number($('newGoal').value) || 10000);
  const checkIn = $('newCheckIn').value;
  const checkOut = $('newCheckOut').value;
  const plot = $('newPlot').value;

  if (editingProjectId) {
    const p = db.projects[editingProjectId];
    p.title = title;
    p.goal = goal;
    p.checkIn = checkIn;
    p.checkOut = checkOut;
    p.plot = plot;
    p.updatedAt = Date.now();

    hideNewProjectModal();
    saveData();
    renderProjectList();

    if (db.currentId === editingProjectId && !$('write').classList.contains('hidden')) {
      $('roomTitle').value = p.title;
      $('goalView').textContent = fmt(p.goal);
      $('plotWork').value = p.plot;
      updateTimer();
      update();
    }
    toast('プラン内容を保存しました');
  } else {
    const id = 'p_' + Date.now();
    db.projects[id] = {
      id: id,
      title: title,
      goal: goal,
      checkIn: checkIn,
      checkOut: checkOut,
      plot: plot,
      text: '',
      elapsedTime: 0,
      lastMilestone: 0,
      updatedAt: Date.now()
    };

    hideNewProjectModal();
    openProject(id);
    toast('チェックインしました！');
  }
}

function deleteProject(id) {
  const p = db.projects[id];
  if (confirm(`作品「${p.title}」の合宿データを削除しますか？`)) {
    delete db.projects[id];
    if (db.currentId === id) {
      const remainingIds = Object.keys(db.projects);
      db.currentId = remainingIds.length > 0 ? remainingIds[0] : null;
    }
    saveData();
    renderProjectList();
    toast('データを削除しました');
  }
}

function updateTitleFromInput() {
  const newTitle = $('roomTitle').value.trim() || '無題';
  if (db.currentId && db.projects[db.currentId]) {
    db.projects[db.currentId].title = newTitle;
    saveData();
  }
}

let sessionStartTime = null;

function startClocks() {
  clearInterval(timerId);
  clearInterval(autoId);
  sessionStartTime = Date.now();
  
  timerId = setInterval(updateTimer, 1000);
  autoId = setInterval(saveData, 15000);
  updateTimer();
}

function updateTimer() {
  if (!db.currentId || !db.projects[db.currentId]) return;
  const p = db.projects[db.currentId];
  
  const currentSessionSec = Math.floor((Date.now() - sessionStartTime) / 1000);
  const totalSec = (p.elapsedTime || 0) + currentSessionSec;

  const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
  const m = String(Math.floor(totalSec % 3600 / 60)).padStart(2, '0');
  const s = String(totalSec % 60).padStart(2, '0');
  $('timer').textContent = `${h}:${m}:${s}`;

  if (p.checkOut) {
    const target = new Date(p.checkOut).getTime();
    const diff = target - Date.now();
    if (isNaN(target)) {
      $('checkoutCountdownContainer').classList.add('hidden');
    } else {
      $('checkoutCountdownContainer').classList.remove('hidden');
      if (diff <= 0) {
        $('checkoutCountdown').textContent = '超過';
        $('checkoutCountdown').style.color = 'var(--danger-btn)';
      } else {
        const remSec = Math.floor(diff / 1000);
        const rh = String(Math.floor(remSec / 3600)).padStart(2, '0');
        const rm = String(Math.floor(remSec % 3600 / 60)).padStart(2, '0');
        const rs = String(remSec % 60).padStart(2, '0');
        $('checkoutCountdown').textContent = `${rh}:${rm}:${rs}`;
        $('checkoutCountdown').style.color = 'var(--ink)';
      }
    }
  } else {
    $('checkoutCountdownContainer').classList.add('hidden');
  }
}

function commitSessionTime() {
  if (!sessionStartTime || !db.currentId || !db.projects[db.currentId]) return;
  const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
  if (elapsed > 0) {
    db.projects[db.currentId].elapsedTime = (db.projects[db.currentId].elapsedTime || 0) + elapsed;
  }
  sessionStartTime = Date.now();
}

function saveNow() {
  commitSessionTime();
  saveData();
  toast('原稿を保存しました');
}

function countText(t) { return [...t].length; }

function update() {
  if (!db.currentId || !db.projects[db.currentId]) return;
  const p = db.projects[db.currentId];
  const n = countText($('manuscript').value);
  const g = Math.max(1, p.goal || 10000);

  $('count').textContent = fmt(n);
  $('percent').textContent = Math.min(100, Math.floor(n / g * 100)) + '%';

  if (db.settings?.showMilestonePopup !== false) {
    const milestone = Math.floor(n / 2500) * 2500;
    if (milestone > 0 && milestone > (p.lastMilestone || 0)) {
      p.lastMilestone = milestone;
      showMilestone(milestone);
    }
  }
}

function showMilestone(n) {
  const scenes = [
    ['二千五百字', '執筆が着実に進んでいます。'],
    ['五千字', '半分まで到達しました。この調子で進めましょう。'],
    ['七千五百字', 'ゴールが見えてきました。'],
    ['一万字', '一万字を達成しました！'],
    ['到達', '目標文字数を突破しました！お疲れ様です。']
  ];
  let i = n >= 10000 ? 4 : Math.floor(n / 2500) - 1;
  $('milestoneTitle').textContent = scenes[i][0];
  $('milestoneText').textContent = scenes[i][1];
  $('milestone').classList.add('show');
}

function closeMilestone() {
  $('milestone').classList.remove('show');
  $('manuscript').focus();
}

function insertSymbol(sym) {
  const el = $('manuscript');
  const start = el.selectionStart;
  const end = el.selectionEnd;
  
  // 現在のカーソル行の行頭からカーソル位置までの文字列を取得
  const lineStart = el.value.lastIndexOf('\n', start - 1) + 1;
  const textBeforeCursor = el.value.substring(lineStart, start);

  let targetStart = start;
  let targetEnd = end;

  // 行頭に全角スペースがあれば、それを消して記号に置き換える
  if (textBeforeCursor === FULL_WIDTH_SPACE || textBeforeCursor === '') {
    targetStart = lineStart;
  }

  el.setRangeText(sym, targetStart, targetEnd, 'end');
  update();
  saveData();
  el.focus();
}

function insertBracket(open, close) {
  const el = $('manuscript');
  const start = el.selectionStart;
  const end = el.selectionEnd;
  
  // 現在のカーソル行の行頭からカーソル位置までの文字列を取得
  const lineStart = el.value.lastIndexOf('\n', start - 1) + 1;
  const textBeforeCursor = el.value.substring(lineStart, start);

  let targetStart = start;
  let targetEnd = end;
  let extraOffset = 0;

  // もし行頭に全角スペースがあれば、それを一緒に巻き込んで置き換える
  if (textBeforeCursor === FULL_WIDTH_SPACE || textBeforeCursor === '') {
    targetStart = lineStart;
    extraOffset = FULL_WIDTH_SPACE.length;
  }

  const selectedText = el.value.substring(targetStart, targetEnd);
  const textToInsert = open + selectedText + close;
  
  el.setRangeText(textToInsert, targetStart, targetEnd, 'select');

  if (targetStart === targetEnd) {
    el.setSelectionRange(targetStart + open.length, targetStart + open.length);
  }

  update();
  saveData();
  el.focus();
}

function showPlot() {
  if (db.currentId && db.projects[db.currentId]) {
    $('plotWork').value = db.projects[db.currentId].plot || '';
  }
  $('plotOverlay').classList.remove('hidden');
}
function hidePlot() {
  $('plotOverlay').classList.add('hidden');
}
function savePlot() {
  if (db.currentId && db.projects[db.currentId]) {
    db.projects[db.currentId].plot = $('plotWork').value;
    saveData();
  }
  hidePlot();
  toast('プロットを保存しました');
}

function exportTxt() {
  saveNow();
  if (!db.currentId || !db.projects[db.currentId]) return;
  
  const p = db.projects[db.currentId];
  const safeTitle = getSafeTitle(p.title);
  const dateStr = getFormattedDate();
  const fileName = `${safeTitle}_${dateStr}.txt`;
  
  const rawText = p.text || '';

  const indentedText = rawText.split('\n').map(line => {
    if (line.length === 0) return line;
    if (/^[  \u3000「『（【〈《〔[{『“"]/.test(line)) {
      return line;
    }
    return FULL_WIDTH_SPACE + line;
  }).join('\n');

  const body = `${p.title || '無題'}\n\n${indentedText}\n`;

  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([body], { type: 'text/plain;charset=utf-8' }));
  a.download = fileName;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('原稿を書き出しました');
}

function exportBackupData(isAll = false) {
  saveNow();
  const dateStr = getFormattedDate();
  let fileName = '';

  if (isAll || $('write').classList.contains('hidden')) {
    fileName = `全作品_バックアップ_${dateStr}.json`;
  } else {
    let safeTitle = '原稿';
    if (db.currentId && db.projects[db.currentId]) {
      safeTitle = getSafeTitle(db.projects[db.currentId].title);
    }
    fileName = `${safeTitle}_バックアップ_${dateStr}.json`;
  }

  const dataStr = JSON.stringify(db, null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([dataStr], { type: 'application/json' }));
  a.download = fileName;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('バックアップを出力しました');
}

function triggerImportFile() {
  $('importFileInput').click();
}

function handleFileImport(event) {
  commitSessionTime();
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (imported && imported.projects) {
        if (confirm('現在のデータを上書きしてバックアップから復元しますか？')) {
          db = imported;
          if (!db.settings) db.settings = { showMilestonePopup: true };
          saveData();
          renderProjectList();
          if (!$('write').classList.contains('hidden') && db.currentId && db.projects[db.currentId]) {
            openProject(db.currentId);
          }
          toast('データを復元しました');
        }
      } else {
        alert('無効なバックアップファイルです。');
      }
    } catch(err) {
      alert('ファイルの読み込みに失敗しました。');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

function toast(t) {
  const e = $('toast');
  e.textContent = t;
  e.classList.add('show');
  setTimeout(() => e.classList.remove('show'), 1800);
}

$('manuscript').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.isComposing) {
    e.preventDefault();
    const el = e.target;
    const start = el.selectionStart;
    const end = el.selectionEnd;
    const val = el.value;

    const textAfterCursor = val.substring(end);
    
    const startsWithBracketOrSpace = /^[  \u3000「『（【〈《〔[{『“"]/.test(textAfterCursor);
    const insertText = '\n' + (startsWithBracketOrSpace ? '' : FULL_WIDTH_SPACE);
    
    el.setRangeText(insertText, start, end, 'end');
    
    update();
    saveData();
  }
});

$('manuscript').addEventListener('paste', () => {
  isPasting = true;
  setTimeout(() => { isPasting = false; }, 100);
});

$('manuscript').addEventListener('input', () => { 
  ensureFirstLineIndent();
  update(); 
  saveData(); 
});

loadData();
renderProjectList();
</script>
</body>
