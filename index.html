<!doctype html>
<html lang="ja">
<head>
<!-- Google tag (gtag.js) -->

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<meta name="description" content="ブラウザだけで使える、小説執筆・原稿管理Webアプリケーション。作品ごとの原稿を管理しながら、文字数・目標文字数・執筆時間などを確認できます">
<meta property="og:title" content="お手軽小説執筆NOTE">
<meta property="og:description" content="ブラウザだけで使える、小説執筆・原稿管理Webアプリケーション。作品ごとの原稿を管理しながら、文字数・目標文字数・執筆時間などを確認できます">
<meta property="og:url" content="https://web-writing-app.netlify.app/">

<!-- PWA (ホーム画面追加) 対応 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="お手軽小説執筆NOTE">

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">

<title>お手軽小説執筆NOTE</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<input type="file" id="js-import-file-input" accept=".json" style="display:none;" onchange="handleFullBackupFileImport(event)">
<input type="file" id="js-import-project-file-input" accept=".json" style="display:none;" onchange="handleProjectFileImport(event)">

<section id="js-lobby" class="screen-lobby">
  <div class="card">
    <header>
      <div>
        <div class="kamon">Web原稿合宿専用</div>
        <h1>お手軽小説執筆NOTE</h1>
      </div>
      <button class="primary" onclick="showNewProjectModal()">＋ 新規プラン作成</button>
    </header>
    <div class="setup">
      <div class="section-title">ご滞在中の作品一覧</div>
      <div id="js-project-list" class="project-list-container"></div>

      <div class="btn">
        <button class="secondary backup-btn" onclick="showJsonMenu('lobby')">作品データ管理</button>
      </div>

      <div id="js-storage-warning" class="storage-warning hidden"></div>

      <div class="note">
        ※ 本文と設定はブラウザ内に自動保存されます。別端末への移行や保存には「バックアップ」機能をご利用ください。
      </div>
    </div>
  </div>
</section>

<section id="js-write" class="hidden">
  <div class="editor-container">
    <div class="editor-header">
      <!-- 上段：右揃えの文字数・進捗・タイマー -->
      <div class="editor-header-top">
        <div class="stats-info">
          <span>文字数: <b id="js-count">0</b> / <span id="js-goal-view">10,000</span></span>
          <span>進捗: <b id="js-percent">0%</b></span>
          <span id="js-checkout-countdown-container">残り: <b id="js-checkout-countdown">--:--:--</b></span>
        </div>
      </div>
      <!-- 下段：横長タイトル表示 ＋ 編集ボタン -->
      <div class="editor-header-bottom">
        <div id="js-room-ttl-display" class="room-title-display" onclick="toggleTitleExpand()" title="タップで全文表示">無題</div>
        <button class="edit-checkout-btn" tabindex="1" onclick="showEditProjectModal(db.currentId)">⚙️ 編集</button>
      </div>
    </div>

    <div class="editor-main">
      <textarea id="js-manuscript" 
                class="sp-compact-textarea"
                tabindex="2"
                placeholder="ここに本文を執筆してください……"
                autocomplete="off" 
                autocorrect="off" 
                autocapitalize="off" 
                spellcheck="false"></textarea>
    </div>

    <div class="editor-footer">
      <!-- 本文・プロット共通の記号バー（DOM上は1個だけ）。
           プロットPOPUP編集中はJS（showPlot/hidePlot）がこの要素を
           #js-plot-overlay側へ一時的に移動する。 -->
      <div class="symbol-bar">
        <button class="symbol-btn" tabindex="3" onclick="insertSymbolShared('――')">――</button>
        <button class="symbol-btn" tabindex="4" onclick="insertSymbolShared('……')">……</button>
        <button class="symbol-btn" tabindex="5" onclick="insertBracketShared('「', '」')">「」</button>
        <button class="symbol-btn" tabindex="6" onclick="insertBracketShared('『', '』')">『』</button>
        <button class="symbol-btn" tabindex="7" onclick="insertBracketShared('（', '）')">（）</button>
        <button class="symbol-btn history-btn" tabindex="8" onclick="undoShared()" aria-label="入力を1つ戻す" title="入力を1つ戻す">↶<span class="history-btn-label"> 戻る</span></button>
        <button class="symbol-btn history-btn" tabindex="9" onclick="redoShared()" aria-label="入力を1つ進める" title="入力を1つ進める">↷<span class="history-btn-label"> 進む</span></button>
      </div>

      <!-- 下段：目立つダークブラウンのメイン操作ボタン -->
      <div class="action-bar">
        <div class="action-group">
          <button class="action-btn" tabindex="10" onclick="saveNow()">local保存</button>
          <button class="action-btn" tabindex="11" onclick="exportTxt()">txt書き出し</button>
          <button class="action-btn" tabindex="12" onclick="showPlot()">プロット</button>
          <button class="action-btn" tabindex="13" onclick="showProjectList()">作品一覧</button>
        </div>
      </div>

      <!-- 整理した最下部フッターメタ情報 -->
      <div class="footer-meta">
        <div class="footer-meta-group">
          <span>執筆時間: <span id="js-timer">00:00:00</span></span>
          <span id="js-current-project-id">ID: ----</span>
          <span id="js-saved">自動保存: 準備中</span>
          <span id="js-storage-warning-write" class="hidden storage-warning-inline"></span>
        </div>
        <div class="footer-meta-btns">
          <button class="secondary" tabindex="14" style="padding:2px 8px;font-size:11px;" onclick="showFontSettings()">Aa 文字設定</button>
          <button class="secondary" tabindex="15" style="padding:2px 8px;font-size:11px;" onclick="cleanupManuscriptSpaces()">␣掃除</button>
          <button class="secondary backup-btn" tabindex="16" style="padding:2px 8px;font-size:11px;" onclick="showJsonMenu('write')">書き出し／読み込み</button>
        </div>
      </div>
    </div>
  </div>

  <div id="js-font-settings-overlay" class="modal-overlay hidden">
    <div class="modal-box" style="max-width:360px;">
      <div class="modal-head">
        <h2>文字設定</h2>
        <button class="close-btn" onclick="hideFontSettings()">×</button>
      </div>
      <div style="display:grid;gap:14px;margin-bottom:20px;">
        <label>フォント
          <select id="js-font-family-select" onchange="previewFontSettings()">
            <option value="gothic">ゴシック体（初期設定）</option>
            <option value="meiryo">メイリオ</option>
            <option value="yugothic">游ゴシック</option>
            <option value="mincho">明朝体</option>
          </select>
        </label>
        <label>
          <span class="field-label-row"><span>文字サイズ</span><span id="js-font-size-value">17px</span></span>
          <input id="js-font-size-range" type="range" min="14" max="26" step="1" oninput="previewFontSettings()">
        </label>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button class="secondary" onclick="hideFontSettings()">キャンセル</button>
        <button class="primary" onclick="saveFontSettings()">保存する</button>
      </div>
    </div>
  </div>

  <div id="js-plot-overlay" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h2>プロット・メモ</h2>
        <button class="close-btn" onclick="hidePlot()">×</button>
      </div>
      <textarea id="js-plot-work" class="plot-textarea sp-compact-textarea" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

      <div class="modal-footer-btns" style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;">
        <button class="secondary" onclick="hidePlot()">閉じる</button>
        <button class="primary" onclick="savePlot()">保存する</button>
      </div>
    </div>
  </div>
</section>

<div id="js-new-project-overlay" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-head">
      <div>
        <h2 id="js-modal-ttl">新規ご宿泊プランの作成</h2>
        <div id="js-modal-project-id" class="modal-project-id hidden"></div>
      </div>
      <button class="close-btn" onclick="hideNewProjectModal()">×</button>
    </div>
    <div style="display:grid;gap:14px;margin-bottom:20px;">
      <label>作品名
        <textarea id="js-new-ttl" class="title-textarea" placeholder="作品名を入力してください"></textarea>
      </label>
      <label>目標文字数
        <input id="js-new-goal" type="number" min="1" step="100" value="10000">
      </label>
      <div class="datetime-grid">
        <label>チェックイン日時
          <input id="js-new-check-in" type="datetime-local">
        </label>
        <label>チェックアウト日時
          <input id="js-new-check-out" type="datetime-local">
        </label>
      </div>
      <label>プロット・メモ
        <textarea id="js-new-plot" style="min-height:80px;" placeholder="登場人物やストーリーのアウトラインなど"></textarea>
      </label>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;">
      <button class="secondary" onclick="hideNewProjectModal()">キャンセル</button>
      <button id="js-save-project-btn" class="primary" onclick="saveProjectModal()">原稿合宿を開始</button>
    </div>
  </div>
</div>

<div id="js-json-menu-overlay" class="modal-overlay hidden">
  <div class="modal-box" style="max-width:360px;">
    <div class="modal-head">
      <h2 id="js-json-menu-ttl">作品データ管理</h2>
      <button class="close-btn" onclick="hideJsonMenu()">×</button>
    </div>
    <div id="js-json-menu-btns" style="display:flex;flex-direction:column;gap:10px;"></div>
  </div>
</div>

<div id="js-import-conflict-overlay" class="modal-overlay hidden">
  <div class="modal-box" style="max-width:380px;">
    <div class="modal-head">
      <h2>作品の読み込み</h2>
      <button class="close-btn" onclick="hideImportConflictModal()">×</button>
    </div>
    <div id="js-import-conflict-msg" style="margin-bottom:14px;font-size:13.5px;line-height:1.6;white-space:pre-line;"></div>
    <div id="js-import-conflict-btns" style="display:flex;flex-direction:column;gap:10px;"></div>
  </div>
</div>

<div id="js-toast" class="js-toast"></div>


<script src="js/app.js"></script>
</body>
</html>
